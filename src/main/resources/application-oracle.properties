# Oracle 11g connection profile.
#
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=oracle
#             or: java -jar target/paypilot.jar --spring.profiles.active=oracle
#
# Prerequisites (one-time):
#   1. Install Oracle Database 11g Express Edition (XE) -- requires an Oracle
#      account to download from Oracle's site, then run their Windows installer.
#      Default listener port: 1521. Default SID for XE: "XE".
#   2. Create a dedicated schema/user for this app instead of using SYSTEM, e.g.
#      from SQL*Plus or SQL Developer connected as SYSTEM:
#        CREATE USER paypilot IDENTIFIED BY "ChangeMe123";
#        GRANT CONNECT, RESOURCE, CREATE SESSION, CREATE TABLE, CREATE SEQUENCE TO paypilot;
#        ALTER USER paypilot QUOTA UNLIMITED ON USERS;
#   3. Fill in the real host/port/SID and the paypilot user's password below
#      (or override via environment variables -- see the ${...} placeholders).

# JDBC thin-driver URL, SID style (Oracle XE's default SID is "XE"):
#   jdbc:oracle:thin:@<host>:<port>:<SID>
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:XE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER:paypilot}
spring.datasource.password=${ORACLE_PASSWORD:ChangeMe123}

# Spring Boot 2.7 brings in Hibernate 5.6, which (unlike Hibernate 6) does not
# have a single version-detecting Oracle dialect -- each Oracle generation needs
# its own dialect class. Oracle10gDialect is Hibernate's documented choice for
# 10g and 11g (there is no separate Oracle11gDialect).
spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Defensive: auto-quotes any column/table name that happens to be an Oracle
# reserved word (e.g. a "password" or "level" column) instead of failing DDL.
# This profile hasn't been exercised against a live Oracle 11g instance yet --
# if you hit a startup/DDL error, paste it back and it'll get fixed.
spring.jpa.properties.hibernate.auto_quote_keyword=true
