spring.application.name=paypilot
server.port=3000

# H2 file-based database (stand-in for the BRD's Oracle 11g; layered architecture is identical)
spring.datasource.url=jdbc:h2:file:./data/paypilot;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

paypilot.jwt.secret=paypilot-dev-secret-change-in-production-please-make-it-long-enough
paypilot.jwt.expiration-hours=8
paypilot.uploads-dir=./uploads
