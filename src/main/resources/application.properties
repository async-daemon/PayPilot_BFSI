spring.application.name=paypilot
server.port=3000

# ---- Database: H2 (embedded, default) ----
# This is the default profile. To connect to a real Oracle 11g instance instead,
# run with -Dspring.profiles.active=oracle (see application-oracle.properties),
# which overrides just the spring.datasource.* / spring.jpa.* properties below --
# no Java code changes are needed either way, since all SQL is generated by
# Hibernate through the Repository interfaces.
spring.datasource.url=jdbc:h2:file:./data/paypilot;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

paypilot.jwt.secret=paypilot-dev-secret-change-in-production-please-make-it-long-enough
paypilot.jwt.expiration-hours=8
paypilot.uploads-dir=./uploads
